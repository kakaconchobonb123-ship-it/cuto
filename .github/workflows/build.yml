name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Clean and Create Project
      run: |
        rm -rf ThangLoApp.xcodeproj project.yml
        cat << 'EOF' > project.yml
        name: ThangLoApp
        options:
          bundleIdPrefix: com.thanglo
          deploymentTarget:
            iOS: "15.0"
        targets:
          ThangLoApp:
            type: application
            platform: iOS
            sources:
              - ThangLoApp
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.thanglo.ThangLoApp
                GENERATE_INFOPLIST_FILE: YES
        EOF
        xcodegen generate

    - name: Build and Package IPA
      run: |
        xcodebuild build \
          -project ThangLoApp.xcodeproj \
          -scheme ThangLoApp \
          -sdk iphonesimulator \
          -configuration Release \
          CONFIGURATION_BUILD_DIR=build
        
        cd build
        mkdir Payload
        cp -r ThangLoApp.app Payload/
        zip -r ThangLoApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-IPA
        path: build/ThangLoApp.ipa
