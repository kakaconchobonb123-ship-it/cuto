name: Build IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Clean Old Files & Create Fresh Code
      run: |
        # Xóa sạch các thư mục cũ để không bị nhận lầm code cũ
        rm -rf *.xcodeproj project.yml ThangLoApp Sources build
        
        # Tạo thư mục và viết lại ContentView.swift mới
        mkdir -p ThangLoApp
        
        cat << 'EOF' > ThangLoApp/ContentView.swift
        import SwiftUI

        @main
        struct ThangLoApp: App {
            var body: some Scene {
                WindowGroup {
                    VStack(spacing: 20) {
                        Text("THẮNG LO SCRIPT HUB")
                            .font(.largeTitle)
                            .bold()
                            .foregroundColor(.cyan)
                        
                        Text("Script Pastefy:")
                            .font(.headline)
                            .foregroundColor(.white)
                        
                        Text("loadstring(game:HttpGet(\"https://pastefy.app/y0dfgg3q/raw\"))()")
                            .font(.system(size: 11, design: .monospaced))
                            .padding()
                            .background(Color.gray.opacity(0.2))
                            .cornerRadius(8)
                            .foregroundColor(.yellow)
                        
                        Button(action: {
                            UIPasteboard.general.string = "loadstring(game:HttpGet(\"https://pastefy.app/y0dfgg3q/raw\"))()"
                        }) {
                            HStack {
                                Image(systemName: "doc.on.doc")
                                Text("SAO CHÉP SCRIPT")
                            }
                            .font(.title3)
                            .bold()
                            .padding()
                            .frame(maxWidth: .infinity)
                            .background(Color.green)
                            .foregroundColor(.white)
                            .cornerRadius(10)
                        }
                        .padding(.horizontal)
                    }
                    .padding()
                    .preferredColorScheme(.dark)
                }
            }
        }
        EOF

        # Tạo file project.yml mới
        cat << 'EOF' > project.yml
        name: ThangLoApp
        options:
          bundleIdPrefix: com.thanglo
          deploymentTarget:
            iOS: "15.0"
        targets:
          ThangLoApp:
            type: application
            platform: iOS
            sources:
              - ThangLoApp
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.thanglo.ThangLoApp
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_KEY_UILaunchScreen_Generation: YES
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
        EOF
        
        xcodegen generate

    - name: Build App Executable
      run: |
        xcodebuild build \
          -project ThangLoApp.xcodeproj \
          -scheme ThangLoApp \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS="" \
          CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
          CONFIGURATION_BUILD_DIR=build

    - name: Package IPA
      run: |
        cd build
        mkdir Payload
        cp -r ThangLoApp.app Payload/
        zip -r ThangLoApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-TrollStore
        path: build/ThangLoApp.ipa
