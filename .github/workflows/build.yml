name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Generate Project and Build IPA
      run: |
        # Tạo ứng dụng iOS bằng xcodebuild archive chuẩn
        xcodebuild archive \
          -project ThangLoApp.xcodeproj \
          -scheme ThangLoApp \
          -archivePath build/ThangLoApp.xcarchive \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

        # Đóng gói file .IPA từ archive
        cd build
        mkdir -p Payload
        cp -r ThangLoApp.xcarchive/Products/Applications/*.app Payload/
        zip -r ThangLoApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-IPA
        path: build/ThangLoApp.ipa
