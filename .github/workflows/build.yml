name: Build IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Setup Project Structure
      run: |
        rm -rf *.xcodeproj project.yml
        
        cat << 'EOF' > project.yml
        name: ThangLoApp
        options:
          bundleIdPrefix: com.thanglo
          deploymentTarget:
            iOS: "15.0"
        targets:
          ThangLoApp:
            type: application
            platform: iOS
            sources:
              - ThangLoApp
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.thanglo.ThangLoApp
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_KEY_UILaunchScreen_Generation: YES
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
        EOF
        
        xcodegen generate

    - name: Build App Executable
      run: |
        xcodebuild build \
          -project ThangLoApp.xcodeproj \
          -scheme ThangLoApp \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS="" \
          CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
          CONFIGURATION_BUILD_DIR=build

    - name: Package IPA
      run: |
        cd build
        mkdir Payload
        cp -r ThangLoApp.app Payload/
        zip -r ThangLoApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-TrollStore
        path: build/ThangLoApp.ipa
