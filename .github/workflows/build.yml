name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Create project.yml for XcodeGen
      run: |
        cat << 'EOF' > project.yml
        name: ThangLoApp
        options:
          bundleIdPrefix: com.example
          deploymentTarget:
            iOS: "15.0"
        targets:
          ThangLoApp:
            type: application
            platform: iOS
            sources:
              - path: ThangLoApp
            settings:
              base:
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_FILE: ThangLoApp/Info.plist
                PRODUCT_BUNDLE_IDENTIFIER: com.example.ThangLoApp
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
        EOF

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App & Package IPA
      run: |
        xcodebuild build \
          -project ThangLoApp.xcodeproj \
          -scheme ThangLoApp \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR=build
        
        cd build
        mkdir Payload
        cp -r ThangLoApp.app Payload/
        zip -r ThangLoApp.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-IPA
        path: build/ThangLoApp.ipa
