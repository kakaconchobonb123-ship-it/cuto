name: Build IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Fresh Swift Project
      run: |
        # Xóa sạch các thư mục cũ tránh xung đột
        rm -rf Sources ThangLoApp project.yml Package.swift
        
        # Tạo cấu trúc code SwiftUI mới tinh
        mkdir -p Sources/ThangLoApp
        cat << 'EOF' > Sources/ThangLoApp/main.swift
        import SwiftUI

        @main
        struct ThangLoApp: App {
            var body: some Scene {
                WindowGroup {
                    Text("Hello TrollStore!")
                        .font(.largeTitle)
                        .padding()
                }
            }
        }
        EOF

        # Tạo file cấu hình SPM Package.swift
        cat << 'EOF' > Package.swift
        // swift-tools-version:5.5
        import PackageDescription

        let package = Package(
            name: "ThangLoApp",
            platforms: [.iOS(.v15)],
            products: [
                .executable(name: "ThangLoApp", targets: ["ThangLoApp"])
            ],
            targets: [
                .executableTarget(
                    name: "ThangLoApp",
                    path: "Sources/ThangLoApp"
                )
            ]
        )
        EOF

    - name: Build Executable
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        swift build -c release --sdk $SDK_PATH -Xswiftc -target -Xswiftc arm64-apple-ios15.0

    - name: Package IPA
      run: |
        mkdir -p build/Payload/ThangLoApp.app
        
        # Coppy file thực thi sau khi build xong
        cp .build/arm64-apple-ios/release/ThangLoApp build/Payload/ThangLoApp.app/
        
        # Tạo Info.plist chuẩn
        cat << 'EOF' > build/Payload/ThangLoApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>ThangLoApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.thanglo.ThangLoApp</string>
            <key>CFBundleName</key>
            <string>ThangLoApp</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <true/>
            </dict>
        </dict>
        </plist>
        EOF

        # Ký giả Ad-Hoc & Nén IPA
        codesign --force --deep --sign - build/Payload/ThangLoApp.app
        cd build
        zip -r ThangLoApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-TrollStore
        path: build/ThangLoApp.ipa
