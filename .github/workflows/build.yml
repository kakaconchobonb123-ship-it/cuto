name: Build IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare Source Code
      run: |
        mkdir -p src_temp
        
        # Gom các file swift hiện có
        find . -maxdepth 3 -name "*.swift" -exec cp {} src_temp/ \; || true
        
        # Nếu chưa có code, tự tạo file SwiftUI chuẩn đéc
        if [ ! -f src_temp/App.swift ]; then
          cat << 'EOF' > src_temp/App.swift
          import SwiftUI

          @main
          struct ThangLoApp: App {
              var body: some Scene {
                  WindowGroup {
                      Text("Hello TrollStore!")
                          .font(.largeTitle)
                  }
              }
          }
          EOF
        fi

    - name: Compile & Package IPA
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        mkdir -p build/Payload/ThangLoApp.app
        
        # Biên dịch Swift ra file thực thi cho iOS ARM64
        swiftc -sdk $SDK_PATH \
               -target arm64-apple-ios15.0 \
               -parse-as-library \
               -framework SwiftUI \
               -framework UIKit \
               -framework Foundation \
               -emit-executable \
               -o build/Payload/ThangLoApp.app/ThangLoApp \
               src_temp/*.swift

        # Tạo Info.plist
        cat << 'EOF' > build/Payload/ThangLoApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>ThangLoApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.thanglo.ThangLoApp</string>
            <key>CFBundleName</key>
            <string>ThangLoApp</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <true/>
            </dict>
        </dict>
        </plist>
        EOF

        # Ký giả Ad-Hoc & Nén IPA
        codesign --force --deep --sign - build/Payload/ThangLoApp.app
        cd build
        zip -r ThangLoApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-TrollStore
        path: build/ThangLoApp.ipa
