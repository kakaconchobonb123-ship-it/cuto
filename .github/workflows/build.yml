name: Build IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare Sources and Compile
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        
        # 1. Tạo thư mục tạm và gom tất cả file .swift vào 1 chỗ
        mkdir -p src_temp
        find . -maxdepth 3 -name "*.swift" -exec cp {} src_temp/ \;
        
        # 2. Tạo cấu trúc thư mục .app
        mkdir -p build/Payload/ThangLoApp.app
        
        # 3. Biên dịch trực tiếp toàn bộ các file swift trong src_temp
        swiftc -sdk $SDK_PATH \
               -target arm64-apple-ios15.0 \
               -parse-as-library \
               -framework SwiftUI \
               -framework UIKit \
               -framework Foundation \
               -emit-executable \
               -o build/Payload/ThangLoApp.app/ThangLoApp \
               src_temp/*.swift

    - name: Create Info.plist & Package IPA
      run: |
        # Tạo Info.plist chuẩn iOS
        cat << 'EOF' > build/Payload/ThangLoApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>ThangLoApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.thanglo.ThangLoApp</string>
            <key>CFBundleName</key>
            <string>ThangLoApp</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <true/>
            </dict>
        </dict>
        </plist>
        EOF

        # Ký Ad-Hoc và nén IPA
        codesign --force --deep --sign - build/Payload/ThangLoApp.app
        cd build
        zip -r ThangLoApp.ipa Payload

    - name: Upload Universal IPA
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-TrollStore
        path: build/ThangLoApp.ipa

