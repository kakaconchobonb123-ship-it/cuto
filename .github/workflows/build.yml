name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build App & Package IPA
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        
        mkdir -p build/ThangLoApp.app
        
        swiftc -sdk $SDK_PATH \
               -target arm64-apple-ios15.0 \
               -parse-as-library \
               -emit-executable \
               -o build/ThangLoApp.app/ThangLoApp \
               ThangLoApp/ThangLoAppApp.swift \
               ThangLoApp/ContentView.swift
        
        cp ThangLoApp/Info.plist build/ThangLoApp.app/
        
        cd build
        mkdir Payload
        cp -r ThangLoApp.app Payload/
        zip -r ThangLoApp.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-IPA
        path: build/ThangLoApp.ipa
