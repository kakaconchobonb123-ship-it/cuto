name: Force Build IPA Universal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Swift Code & Package IPA
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        
        # 1. Tạo thư mục cấu trúc cho app iOS
        mkdir -p build/Payload/ThangLoApp.app
        
        # 2. Tìm tất cả file .swift trong dự án để biên dịch
        SWIFT_FILES=$(find . -name "*.swift" ! -path "*/.*")
        
        # 3. Biên dịch trực tiếp ra file thực thi
        swiftc -sdk $SDK_PATH \
               -target arm64-apple-ios15.0 \
               -parse-as-library \
               -framework SwiftUI \
               -framework UIKit \
               -framework Foundation \
               -emit-executable \
               -o build/Payload/ThangLoApp.app/ThangLoApp \
               $SWIFT_FILES
               
        # 4. Tạo file cấu hình Info.plist
        cat << 'EOF' > build/Payload/ThangLoApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>ThangLoApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.thanglo.ThangLoApp</string>
            <key>CFBundleName</key>
            <string>ThangLoApp</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <true/>
            </dict>
        </dict>
        </plist>
        EOF

        # 5. Ký giả Ad-Hoc & đóng gói thành IPA
        codesign --force --deep --sign - build/Payload/ThangLoApp.app
        cd build
        zip -r ThangLoApp.ipa Payload

    - name: Upload Universal IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThangLoApp-Universal-IPA
        path: build/ThangLoApp.ipa
