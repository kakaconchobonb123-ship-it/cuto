name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Build App with Swift
      run: |
        mkdir -p build/Payload/ThangLoApp.app
        
        # Biên dịch ứng dụng Swift cho iOS
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios14.0 \
               -emit-executable \
               -o build/Payload/ThangLoApp.app/ThangLoApp \
               ThangLoApp/ContentView.swift \
               ThangLoApp/ThangLoAppApp.swift
        
        # Copy Info.plist vào app
        cp ThangLoApp/Info.plist build/Payload/ThangLoApp.app/Info.plist
        
        # Đóng gói thành file IPA
        cd build
        zip -r ThangLoApp.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ThangLoApp-IPA
        path: build/ThangLoApp.ipa

